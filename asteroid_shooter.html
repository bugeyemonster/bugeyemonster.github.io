<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Shooter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #0a0a0a;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            text-shadow: 0 0 5px #0ff;
        }

        #game-over-screen, #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #f0f;
        }
        
        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            background: #111;
            border: 2px solid #333;
            color: #fff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 20px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            margin-top: 20px;
        }

        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff, 0 0 30px #0ff;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="ui-container">
            <span id="score">Score: 0</span>
            <span id="lives">Lives: 3</span>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-screen">
            <h1>ASTEROID SHOOTER</h1>
            <p>Use ARROW KEYS to move and rotate.<br>Press SPACE to shoot.</p>
            <button id="startButton">Start Game</button>
        </div>
        
        <div id="game-over-screen" style="display: none;">
            <h1>GAME OVER</h1>
            <p id="final-score">Your Score: 0</p>
            <button id="restartButton">Restart Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const finalScoreEl = document.getElementById('final-score');

        let ship, bullets, asteroids, particles;
        let score, lives, level, gameOver;
        let keys = {};

        const SHIP_SIZE = 30;
        const SHIP_THRUST = 0.1;
        const SHIP_TURN_SPEED = 0.1;
        const FRICTION = 0.99;
        const BULLET_SPEED = 7;
        const ASTEROID_SPEED = 1;
        const ASTEROID_SIZES = [60, 30, 15]; // Large, medium, small
        const ASTEROID_POINTS = [20, 50, 100];

        function resizeCanvas() {
            const container = document.querySelector('.game-container');
            let size = Math.min(container.clientWidth * 0.9, container.clientHeight * 0.9);
            const aspectRatio = 16 / 9;
            let width = size;
            let height = size / aspectRatio;

            if (height > container.clientHeight * 0.9) {
                height = container.clientHeight * 0.9;
                width = height * aspectRatio;
            }
            
            canvas.width = width;
            canvas.height = height;
        }


        class Ship {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = SHIP_SIZE / 2;
                this.angle = 0; // Pointing up
                this.vel = { x: 0, y: 0 };
                this.thrusting = false;
                this.isInvincible = false;
                this.invincibilityTime = 3000; // 3 seconds
                this.blinkDuration = 200; // ms
                this.blinkTime = 0;
            }

            draw() {
                if (this.isInvincible) {
                    this.blinkTime += 16; // Approx ms per frame
                    if (this.blinkTime % (2 * this.blinkDuration) < this.blinkDuration) {
                        return; // Blink off
                    }
                }

                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                // Nose
                ctx.moveTo(
                    this.x + this.radius * Math.cos(this.angle),
                    this.y - this.radius * Math.sin(this.angle)
                );
                // Left wing
                ctx.lineTo(
                    this.x - this.radius * (Math.cos(this.angle) + Math.sin(this.angle)),
                    this.y + this.radius * (Math.sin(this.angle) - Math.cos(this.angle))
                );
                // Right wing
                ctx.lineTo(
                    this.x - this.radius * (Math.cos(this.angle) - Math.sin(this.angle)),
                    this.y + this.radius * (Math.sin(this.angle) + Math.cos(this.angle))
                );
                ctx.closePath();
                ctx.stroke();

                if (this.thrusting) {
                    ctx.fillStyle = "#ff9900";
                    ctx.beginPath();
                    ctx.moveTo(
                        this.x - this.radius * (1.2 * Math.cos(this.angle) - 0.5 * Math.sin(this.angle)),
                        this.y + this.radius * (1.2 * Math.sin(this.angle) + 0.5 * Math.cos(this.angle))
                    );
                    ctx.lineTo(
                        this.x - this.radius * 1.5 * Math.cos(this.angle),
                        this.y + this.radius * 1.5 * Math.sin(this.angle)
                    );
                    ctx.lineTo(
                        this.x - this.radius * (1.2 * Math.cos(this.angle) + 0.5 * Math.sin(this.angle)),
                        this.y + this.radius * (1.2 * Math.sin(this.angle) - 0.5 * Math.cos(this.angle))
                    );
                    ctx.closePath();
                    ctx.fill();
                }
            }

            update() {
                if (keys['ArrowUp']) {
                    this.vel.x += SHIP_THRUST * Math.cos(this.angle);
                    this.vel.y -= SHIP_THRUST * Math.sin(this.angle);
                    this.thrusting = true;
                } else {
                    this.thrusting = false;
                }

                if (keys['ArrowLeft']) {
                    this.angle += SHIP_TURN_SPEED;
                }
                if (keys['ArrowRight']) {
                    this.angle -= SHIP_TURN_SPEED;
                }

                this.vel.x *= FRICTION;
                this.vel.y *= FRICTION;

                this.x += this.vel.x;
                this.y += this.vel.y;

                this.handleScreenWrap();
                this.draw();
            }

            handleScreenWrap() {
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            shoot() {
                bullets.push(new Bullet(
                    this.x + this.radius * Math.cos(this.angle),
                    this.y - this.radius * Math.sin(this.angle),
                    this.angle
                ));
            }
            
            makeInvincible() {
                this.isInvincible = true;
                setTimeout(() => {
                    this.isInvincible = false;
                }, this.invincibilityTime);
            }
        }

        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.vel = {
                    x: BULLET_SPEED * Math.cos(angle),
                    y: -BULLET_SPEED * Math.sin(angle)
                };
                this.radius = 3;
                this.life = 100; // Frames
            }

            draw() {
                ctx.fillStyle = '#f0f';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                this.x += this.vel.x;
                this.y += this.vel.y;
                this.life--;
                this.draw();
            }
        }

        class Asteroid {
            constructor(x, y, sizeIndex) {
                this.x = x !== undefined ? x : (Math.random() < 0.5 ? 0 : canvas.width);
                this.y = y !== undefined ? y : (Math.random() < 0.5 ? 0 : canvas.height);
                this.sizeIndex = sizeIndex;
                this.radius = ASTEROID_SIZES[sizeIndex];
                this.angle = Math.random() * Math.PI * 2;
                this.speed = ASTEROID_SPEED * (3 - sizeIndex);
                this.vel = {
                    x: Math.cos(this.angle) * this.speed,
                    y: Math.sin(this.angle) * this.speed
                };
                this.sides = Math.floor(Math.random() * 5) + 8; // 8 to 12 sides
                this.offsets = [];
                for (let i = 0; i < this.sides; i++) {
                    this.offsets.push(Math.random() * this.radius * 0.8 - this.radius * 0.4);
                }
            }

            draw() {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < this.sides; i++) {
                    const angle = (i / this.sides) * Math.PI * 2;
                    const r = this.radius + this.offsets[i];
                    const x = this.x + r * Math.cos(angle);
                    const y = this.y + r * Math.sin(angle);
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.stroke();
            }

            update() {
                this.x += this.vel.x;
                this.y += this.vel.y;
                this.handleScreenWrap();
                this.draw();
            }

            handleScreenWrap() {
                if (this.x - this.radius > canvas.width) this.x = -this.radius;
                if (this.x + this.radius < 0) this.x = canvas.width + this.radius;
                if (this.y - this.radius > canvas.height) this.y = -this.radius;
                if (this.y + this.radius < 0) this.y = canvas.height + this.radius;
            }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2 + 1;
                this.vel = {
                    x: (Math.random() - 0.5) * 4,
                    y: (Math.random() - 0.5) * 4
                };
                this.life = 50; // frames
                this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.vel.x;
                this.y += this.vel.y;
                this.life--;
                this.alpha = this.life / 50;
                this.draw();
            }
        }
        
        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function init() {
            score = 0;
            lives = 3;
            level = 1;
            gameOver = false;
            
            ship = new Ship();
            ship.makeInvincible();
            bullets = [];
            asteroids = [];
            particles = [];
            createAsteroidsForLevel();

            updateUI();
            gameOverScreen.style.display = 'none';
        }

        function createAsteroidsForLevel() {
            for (let i = 0; i < level + 2; i++) {
                asteroids.push(new Asteroid(undefined, undefined, 0));
            }
        }

        function updateUI() {
            scoreEl.textContent = `Score: ${score}`;
            livesEl.textContent = `Lives: ${lives}`;
        }
        
        function handleCollisions() {
            // Asteroid - Bullet collisions
            for (let i = asteroids.length - 1; i >= 0; i--) {
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const a = asteroids[i];
                    const b = bullets[j];
                    if (!a || !b) continue;

                    const dist = Math.hypot(a.x - b.x, a.y - b.y);
                    if (dist < a.radius) {
                        createExplosion(a.x, a.y, '#fff');
                        score += ASTEROID_POINTS[a.sizeIndex];
                        updateUI();

                        if (a.sizeIndex < 2) { // Break into smaller asteroids
                            asteroids.push(new Asteroid(a.x, a.y, a.sizeIndex + 1));
                            asteroids.push(new Asteroid(a.x, a.y, a.sizeIndex + 1));
                        }
                        
                        asteroids.splice(i, 1);
                        bullets.splice(j, 1);
                        break; 
                    }
                }
            }

            // Ship - Asteroid collision
            if (!ship.isInvincible) {
                 for (let i = asteroids.length - 1; i >= 0; i--) {
                    const a = asteroids[i];
                    const dist = Math.hypot(ship.x - a.x, ship.y - a.y);
                    if (dist < ship.radius + a.radius) {
                        createExplosion(ship.x, ship.y, '#f0f');
                        lives--;
                        updateUI();
                        if (lives <= 0) {
                           endGame();
                        } else {
                            ship = new Ship();
                            ship.makeInvincible();
                        }
                        
                        createExplosion(a.x, a.y, '#fff');
                        if (a.sizeIndex < 2) {
                             asteroids.push(new Asteroid(a.x, a.y, a.sizeIndex + 1));
                             asteroids.push(new Asteroid(a.x, a.y, a.sizeIndex + 1));
                        }
                        asteroids.splice(i, 1);
                        break;
                    }
                }
            }
        }
        
        function endGame() {
            gameOver = true;
            finalScoreEl.textContent = `Your Score: ${score}`;
            gameOverScreen.style.display = 'block';
        }

        function gameLoop() {
            if (gameOver) return;

            requestAnimationFrame(gameLoop);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update and draw ship
            ship.update();

            // Update and draw bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                if (bullets[i].life <= 0) {
                    bullets.splice(i, 1);
                }
            }

            // Update and draw asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                asteroids[i].update();
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            handleCollisions();

            if (asteroids.length === 0) {
                level++;
                createAsteroidsForLevel();
                ship.makeInvincible();
            }
        }
        
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && !gameOver) {
                e.preventDefault();
                ship.shoot();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        startButton.addEventListener('click', () => {
            startScreen.style.display = 'none';
            init();
            gameLoop();
        });

        restartButton.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            init();
            gameLoop();
        });


        // Initial setup
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

    </script>
</body>
</html>
