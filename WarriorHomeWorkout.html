<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home HIIT Strength Workout</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #f0f0f0;
            --accent-color: #ff4500;
            --secondary-text: #a0a0a0;
            --btn-bg: #333;
            --btn-hover: #555;
            --panel-bg: #1e1e1e;
            --rest-color: #4CAF50;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            padding: 40px 0;
        }

        #intro-screen, #practice-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #practice-screen {
            display: none; 
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }
        
        h2 {
            font-size: 1.5rem;
            color: var(--secondary-text);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .equipment-list {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: left;
            width: 100%;
            max-width: 400px;
        }

        .equipment-list ul {
            margin: 0;
            padding-left: 20px;
            color: var(--secondary-text);
            font-size: 1.1rem;
        }

        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            font-size: 1.1rem;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            text-align: center;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        .media-placeholder {
            width: 100%;
            max-width: 600px;
            height: 350px;
            background-color: var(--panel-bg);
            border: 2px dashed #555;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 1.2rem;
        }

        .timer-display {
            font-size: 6rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin-bottom: 20px;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            min-width: 120px;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        #start-btn {
            background-color: var(--accent-color);
            color: #fff;
            font-size: 1.5rem;
            padding: 20px 40px;
            width: 100%;
            max-width: 440px;
        }

        #start-btn:hover {
            background-color: #cc3700;
        }

        .up-next {
            font-size: 1.1rem;
            color: var(--secondary-text);
            background-color: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
        }
        
        #round-indicator {
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- INTRO SCREEN -->
        <div id="intro-screen">
            <h1>Home HIIT Strength Workout</h1>
            
            <div class="equipment-list">
                <h3>Required Equipment:</h3>
                <ul>
                    <li>1x 20kg Kettlebell</li>
                    <li>2x 15kg Dumbbells</li>
                    <li>Ab Roller</li>
                    <li>Push-up Stands</li>
                </ul>
            </div>

            <div class="settings-panel">
                <div class="setting-row">
                    <label for="rounds-input">Number of Rounds:</label>
                    <input type="number" id="rounds-input" min="1" max="10" value="3">
                </div>
                <div class="setting-row">
                    <label for="randomize-input">Randomize Exercise Order:</label>
                    <input type="checkbox" id="randomize-input">
                </div>
            </div>

            <button id="start-btn" onclick="startWorkout()">Start Workout</button>
        </div>

        <!-- PRACTICE SCREEN -->
        <div id="practice-screen">
            
            <div id="round-indicator">Round 1 of 3</div>
            
            <div class="media-placeholder" id="media-container">
                [ Image / GIF Placeholder ]
            </div>

            <h1 id="exercise-name">Exercise Name</h1>
            <h2 id="equipment-needed">Equipment Needed</h2>

            <div class="timer-display" id="timer">01:30</div>

            <div class="controls">
                <button id="pause-btn" onclick="togglePause()">Pause</button>
                <button id="skip-btn" onclick="skipExercise()">Skip</button>
            </div>

            <div class="up-next" id="up-next">
                <strong>Up Next:</strong> <span id="next-exercise-name">...</span>
            </div>

        </div>

    </div>

    <script>
        // --- DATA SEQUENCE ---
        const baseExercises = [
            { name: "Push Ups (10 Reps)", equipment: "Push-up Stands", duration: 90, isRest: false },
            { name: "Bicep Curls (10 Reps)", equipment: "2x 15kg Dumbbells", duration: 90, isRest: false },
            { name: "Overhead Press (10 Reps)", equipment: "2x 15kg Dumbbells", duration: 90, isRest: false },
            { name: "Kettlebell Swings (20 Reps)", equipment: "20kg Kettlebell", duration: 90, isRest: false },
            { name: "Squats (5 Reps)", equipment: "20kg Kettlebell", duration: 90, isRest: false },
            { name: "Lunges (6 Reps / 3 per side)", equipment: "20kg Kettlebell or Bodyweight", duration: 90, isRest: false },
            { name: "Ab Rollers (8 Reps)", equipment: "Ab Roller", duration: 90, isRest: false }
        ];

        let workoutSequence = [];
        let currentIndex = 0;
        let timeLeft = 0;
        let timerInterval = null;
        let isPaused = false;
        let totalRounds = 1;

        // DOM Elements
        const introScreen = document.getElementById('intro-screen');
        const practiceScreen = document.getElementById('practice-screen');
        const exerciseNameEl = document.getElementById('exercise-name');
        const equipmentNeededEl = document.getElementById('equipment-needed');
        const timerEl = document.getElementById('timer');
        const upNextEl = document.getElementById('next-exercise-name');
        const pauseBtn = document.getElementById('pause-btn');
        const roundIndicatorEl = document.getElementById('round-indicator');

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startWorkout() {
            totalRounds = parseInt(document.getElementById('rounds-input').value);
            const shouldRandomize = document.getElementById('randomize-input').checked;

            workoutSequence = [];

            for (let r = 1; r <= totalRounds; r++) {
                let currentCircuit = [...baseExercises];
                if (shouldRandomize) {
                    shuffleArray(currentCircuit);
                }

                currentCircuit.forEach(ex => {
                    workoutSequence.push({ ...ex, round: r });
                });

                // Add 5-minute (300 sec) rest between rounds, except after the last round
                if (r < totalRounds) {
                    workoutSequence.push({ 
                        name: "Round Complete - Rest & Recover", 
                        equipment: "Water & Towel", 
                        duration: 300, 
                        isRest: true,
                        round: r
                    });
                }
            }

            introScreen.style.display = 'none';
            practiceScreen.style.display = 'flex';
            loadExercise(currentIndex);
        }

        function loadExercise(index) {
            if (index >= workoutSequence.length) {
                finishWorkout();
                return;
            }

            const currentExercise = workoutSequence[index];
            exerciseNameEl.innerText = currentExercise.name;
            equipmentNeededEl.innerText = currentExercise.equipment;
            roundIndicatorEl.innerText = `Round ${currentExercise.round} of ${totalRounds}`;
            
            // Visual cue for rest period
            if (currentExercise.isRest) {
                timerEl.style.color = "var(--rest-color)";
                exerciseNameEl.style.color = "var(--rest-color)";
            } else {
                timerEl.style.color = "var(--text-color)";
                exerciseNameEl.style.color = "var(--accent-color)";
            }

            timeLeft = currentExercise.duration;
            timerEl.innerText = formatTime(timeLeft);

            // Update Up Next
            if (index + 1 < workoutSequence.length) {
                const nextEx = workoutSequence[index + 1];
                let nextText = `${nextEx.name} (${nextEx.equipment})`;
                if(nextEx.round > currentExercise.round && !currentExercise.isRest) {
                    nextText = `[START ROUND ${nextEx.round}] ` + nextText;
                }
                upNextEl.innerText = nextText;
            } else {
                upNextEl.innerText = "Finish Workout";
            }

            isPaused = false;
            pauseBtn.innerText = "Pause";
            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
        }

        function tick() {
            if (isPaused) return;

            timeLeft--;
            timerEl.innerText = formatTime(timeLeft);

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                currentIndex++;
                loadExercise(currentIndex);
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.innerText = "Resume";
            } else {
                pauseBtn.innerText = "Pause";
            }
        }

        function skipExercise() {
            clearInterval(timerInterval);
            currentIndex++;
            loadExercise(currentIndex);
        }

        function finishWorkout() {
            clearInterval(timerInterval);
            exerciseNameEl.innerText = "Workout Complete";
            equipmentNeededEl.innerText = "Great Job!";
            roundIndicatorEl.innerText = "";
            timerEl.innerText = "00:00";
            timerEl.style.color = "var(--text-color)";
            document.querySelector('.controls').style.display = 'none';
            document.getElementById('up-next').style.display = 'none';
            document.getElementById('media-container').innerText = "Session Finished.";
        }

    </script>
</body>
</html>
